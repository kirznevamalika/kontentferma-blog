name: Update RSS & JSON Feed

on:
  schedule:
    # Run at 08:00 UTC (10:00 Europe/Nicosia) and 15:00 UTC (17:00 Europe/Nicosia) daily
    - cron: '0 8,15 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-feed:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Regenerate RSS and JSON Feed
        run: node generate_rss.js

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add rss.xml feed.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore(feed): scheduled rss update" && git push)
